<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const s = localStorage.getItem("color-scheme");
      if (s === "light" || s === "dark") {
        document.querySelector('meta[name="color-scheme"]').content = s;
      }
    } catch {}
  </script>
  <title>Page Not Found | BlackbirdWorks</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css?v=5">
</head>
<body>
  <main class="container not-found-main">
    <p class="eyebrow not-found-eyebrow">404</p>
    <h1>Page not found</h1>
    <p class="section-subtitle">The page you requested does not exist on blackbirdworks.dev.</p>
    <div>
      <a href="./" class="btn btn-primary">Return to BlackbirdWorks Portfolio</a>
    </div>
  </main>
</body>
</html>
